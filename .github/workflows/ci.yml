name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: gates · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # 원 시스템은 Windows 서비스로 가동하고 Linux CI 에서도 돈다
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev tools
        run: python -m pip install --upgrade pip "pytest>=8" "ruff>=0.6"
      - name: Lint (ruff)
        run: ruff check .
      - name: Self-check (standalone, stdlib only)
        run: python -X utf8 -I showcase/determinism/determinism_showcase.py   # Windows 콘솔(cp1252)에서도 한글 출력
      - name: Tests (pytest)
        run: python -m pytest
      - name: Badges are reproducible
        run: |
          python scripts/gen_badges.py
          git diff --exit-code -- assets/readme
